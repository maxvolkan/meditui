[package]
name = "meditui"
version = "0.1.0"
edition = "2024"
description = "guided meditation tui"
license = "MIT"
repository = "https://github.com/maxvolkan/meditui"
readme = "README.md"
keywords = ["meditation", "breathing", "tui", "terminal", "pomodoro"]
categories = ["command-line-utilities"]
exclude = ["assets/"]

[dependencies]
ratatui = { version = "0.30.0", features = ["all-widgets"]}
color-eyre = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
dirs = "7.0.0"
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
toml = "1.1.8"
notify-rust = "4.18.2"
keepawake = "0.6.1"

[[bin]]
name = "medi"
path = "src/main.rs"
